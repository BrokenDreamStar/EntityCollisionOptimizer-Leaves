name: Build plugin

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build plugin jar (macOS arm64)
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Download the leavesclip launcher jar
        run: curl -fsSL -o "$RUNNER_TEMP/leaves-26.1.2.jar" "https://github.com/${{ github.repository }}/releases/download/runtime-26.1.2/leaves-26.1.2.jar"

      - name: Build
        run: LEAVES_JAR="$RUNNER_TEMP/leaves-26.1.2.jar" zsh leaves/build-plugin.sh

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: EntityCollisionOptimizer-Leaves
          path: dist/EntityCollisionOptimizer-Leaves.jar
          if-no-files-found: error
          retention-days: 14
