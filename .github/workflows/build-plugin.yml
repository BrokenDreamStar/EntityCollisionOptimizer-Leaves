name: Build plugin

on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  x64-natives:
    name: Cross-compile x64 natives (Windows, Linux, macOS)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the x64 native libraries
        run: .\gradlew.bat prepareNativeResources --no-daemon

      - name: Upload the x64 natives
        uses: actions/upload-artifact@v7
        with:
          name: natives-x64
          path: native/out/entity-collision-optimizer/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package the plugin jar (adds the macOS arm64 native)
    needs: x64-natives
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Download the leavesclip launcher jar
        run: curl -fsSL -o "$RUNNER_TEMP/leaves-26.1.2.jar" "https://github.com/${{ github.repository }}/releases/download/runtime-26.1.2/leaves-26.1.2.jar"

      - name: Download the x64 natives
        uses: actions/download-artifact@v8
        with:
          name: natives-x64
          path: x64-natives

      - name: Collect the x64 natives
        # macos-x64 targets Intel Macs only; Apple Silicon uses the arm64 native built below.
        run: |
          mkdir -p native/out
          mv x64-natives/win-x64 native/out/windows-x64
          mv x64-natives/linux-x64 native/out/linux-x64
          rm -rf x64-natives

      - name: Build
        run: LEAVES_JAR="$RUNNER_TEMP/leaves-26.1.2.jar" zsh leaves/build-plugin.sh

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: EntityCollisionOptimizer-Leaves
          path: dist/EntityCollisionOptimizer-Leaves.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the jar
        uses: actions/download-artifact@v8
        with:
          name: EntityCollisionOptimizer-Leaves

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" EntityCollisionOptimizer-Leaves.jar --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
